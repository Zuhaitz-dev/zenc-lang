name: Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y libtcc-dev

    - name: Build Compiler
      run: make ZC_HAS_JIT=1

    - name: Run Benchmarks
      run: ./tests/scripts/run_benchmarks.sh

    - name: Ensure benchmark branch exists
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Try to fetch gh-pages; if it doesn't exist on remote, create it locally as an orphan
        git fetch origin gh-pages:gh-pages || git branch gh-pages || true

    - name: Store Benchmark Results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Zen Compiler Benchmarks
        tool: 'customSmallerIsBetter'
        output-file-path: benchmarks_result.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Only push on main branch
        auto-push: ${{ github.ref == 'refs/heads/main' }}
        # The action can only apply a single global threshold, which is too
        # tight for micro-benchmarks on noisy GitHub-hosted runners. It just
        # stores the data; the next step applies magnitude-aware thresholds.
        alert-threshold: '200%'
        comment-on-alert: false
        fail-on-alert: false
        # Ignore failure if gh-pages branch doesn't exist
        skip-fetch-gh-pages: true

    - name: Check Benchmark Regressions (magnitude-aware)
      run: python3 tests/scripts/check_benchmarks.py
